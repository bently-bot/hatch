name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-wayland-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make weston
      - name: Fetch kotlinc
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo /opt/kotlinc/bin >> $GITHUB_PATH
      - name: Build host native + compositor proof
        run: |
          mkdir -p build/host harness-out
          gcc -shared -fPIC -O2 -DHATCH_HOST -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o build/host/libhatchnative.so app/src/main/cpp/hatchnative.c -lpthread
          kotlinc -d build/host/classes -jvm-target 17 \
            app/src/main/kotlin/dev/hatch/wayland/*.kt harness/src/dev/hatch/harness/Main.kt
          CLIENT=$(command -v weston-simple-shm)
          java -Dhatch.native=$PWD/build/host/libhatchnative.so \
            -cp "build/host/classes:/opt/kotlinc/lib/kotlin-stdlib.jar" \
            dev.hatch.harness.MainKt \
            "$RUNNER_TEMP/wayland" \
            harness-out/simple-shm.png \
            20 -- "$CLIENT"
      - uses: actions/upload-artifact@v4
        with:
          name: simple-shm-png
          path: harness-out/simple-shm.png

  arm64-guest-proof:
    # Real Debian 13 arm64 rootfs under proot, apps installed by the app's own guest scripts from
    # catalogue.json, rendered through Hatch's compositor. Wine = Debian's wine 10 arm64 + winewayland.drv.
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootfs.tar.xz
          key: rootfs-${{ hashFiles('app/src/main/kotlin/dev/hatch/guest/RootfsCatalog.kt') }}
      - name: Guest apps (Linux + Wine + X11) rendered by Hatch compositor
        env:
          PROOF_DIR: harness-out
          APPS: mousepad galculator gnome-mines xterm featherpad gnome-chess notepadpp
        run: bash scripts/ci-guest-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-guest-proofs
          path: |
            harness-out/*.png
            harness-out/*.log

  android-assemble:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Set up Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            for d in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              [ -d "$d" ] && export ANDROID_HOME="$d" && break
            done
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)
          [ -n "$SM" ] || SM=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Assemble debug
        run: |
          chmod +x gradlew
          if ! ls "$ANDROID_HOME"/platforms | grep -q 'android-37'; then
            sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          fi
          ./gradlew :app:assembleDebug --stacktrace
      - name: Assemble signed release
        env:
          HATCH_KEYSTORE_BASE64: ${{ secrets.HATCH_KEYSTORE_BASE64 }}
          HATCH_KEYSTORE_PASSWORD: ${{ secrets.HATCH_KEYSTORE_PASSWORD }}
          HATCH_KEY_ALIAS: hatch
          HATCH_KEY_PASSWORD: ${{ secrets.HATCH_KEY_PASSWORD }}
        run: |
          if [ -z "$HATCH_KEYSTORE_BASE64" ]; then
            echo "No signing secrets; skip release APK"
            exit 0
          fi
          if ! ls "$ANDROID_HOME"/platforms | grep -q 'android-37'; then
            sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          fi
          ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hatch-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk


  android-emu-e2e:
    needs: [android-assemble]
    if: needs.android-assemble.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hatch-apks
          path: apks
      - name: Free disk space (emulator userdata needs room)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift || true
          df -h /
      - name: Python deps
        run: python3 -m pip install --quiet pillow || sudo apt-get install -y -qq python3-pil
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disk-size: 6G
          ram-size: 4096M
          emulator-options: -no-metrics -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # emulator-runner runs each script line in its own sh, so keep it to one line
          script: PROOF_DIR=harness-out/emu bash scripts/emu-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-e2e-proofs
          path: |
            harness-out/emu/*.png
            harness-out/emu/*.txt

  draft-release:
    needs: [host-wayland-proof, android-assemble, arm64-guest-proof]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.android-assemble.result == 'success' && needs.host-wayland-proof.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.0-dev.${GITHUB_SHA::7}"
          mkdir -p upload
          find arts -name '*.apk' -exec cp {} upload/ \;
          find arts -name '*.png' -exec cp {} upload/ \;
          cp catalogue/catalogue.json upload/
          ls -la upload/
          NOTES="Hatch draft $TAG. Wayland host proof + Android APKs + arm64 guest screenshots when available. Fold 8 / 4K pages. Not production."
          gh release create "$TAG" upload/* \
            --draft \
            --title "Hatch $TAG" \
            --notes "$NOTES" \
            || { gh release upload "$TAG" upload/* --clobber; }
