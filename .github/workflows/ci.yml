name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-wayland-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make weston
      - name: Fetch kotlinc
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo /opt/kotlinc/bin >> $GITHUB_PATH
      - name: Build host native + compositor proof
        run: |
          mkdir -p build/host harness-out
          gcc -shared -fPIC -O2 -DHATCH_HOST -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o build/host/libhatchnative.so app/src/main/cpp/hatchnative.c -lpthread
          kotlinc -d build/host/classes -jvm-target 17 \
            app/src/main/kotlin/dev/hatch/wayland/*.kt harness/src/dev/hatch/harness/Main.kt
          CLIENT=$(command -v weston-simple-shm)
          java -Dhatch.native=$PWD/build/host/libhatchnative.so \
            -cp "build/host/classes:/opt/kotlinc/lib/kotlin-stdlib.jar" \
            dev.hatch.harness.MainKt \
            "$RUNNER_TEMP/wayland" \
            harness-out/simple-shm.png \
            20 -- "$CLIENT"
      - uses: actions/upload-artifact@v4
        with:
          name: simple-shm-png
          path: harness-out/simple-shm.png

  android-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (preinstalled runner image)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Accept licenses + install what we need (no obsolete 'tools' package)
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Assemble debug
        run: |
          chmod +x gradlew
          # compileSdk 37 may not be on runners yet — fall back to 36 if needed
          if ! ls "$ANDROID_HOME"/platforms | grep -q 'android-37'; then
            sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
            # Silence AarMetadata check for compose needing 37 when only 36 present
            mkdir -p app
            grep -q 'android.experimental' gradle.properties || \
              echo 'android.experimental.lint.missingResourceTracking=true' >> gradle.properties
            # Allow lower compileSdk via gradle property used by AGP CheckAarMetadata
            echo 'android.suppressUnsupportedCompileSdk=37' >> gradle.properties
          fi
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  draft-release:
    needs: [host-wayland-proof, android-assemble]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls arts/hatch-debug-apk/*.apk | head -1)
          PNG=$(ls arts/simple-shm-png/*.png | head -1)
          TAG="v0.1.0-dev.${GITHUB_SHA::7}"
          gh release create "$TAG" "$APK" "$PNG" \
            --draft \
            --title "Hatch $TAG" \
            --notes "Automated draft. Wayland host proof + debug APK. Not for production." \
            || gh release upload "$TAG" "$APK" "$PNG" --clobber
